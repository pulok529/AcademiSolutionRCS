version: "3.9"

# =============================================================================
# AcademiSolutionRCS — Docker Compose Scaffold
# All services defined with names and ports.
# Actual service implementations will be added in Phase 4.
# =============================================================================
# Usage:
#   cp .env.example .env   → fill in your values
#   docker compose up -d   → start all services
# =============================================================================

networks:
  academi-network:
    driver: bridge

volumes:
  mssql-data:
  redis-data:
  rabbitmq-data:
  seq-data:
  prometheus-data:
  grafana-data:
  keycloak-data:
  nginx-certs:

services:

  # ─── Nginx (Reverse Proxy + SSL Termination) ─────────────────────────────────
  academi-nginx:
    image: nginx:alpine
    container_name: academi-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - academi-gateway
    networks:
      - academi-network
    restart: unless-stopped

  # ─── YARP API Gateway ────────────────────────────────────────────────────────
  academi-gateway:
    image: academi/api-gateway:latest
    container_name: academi-gateway
    build:
      context: ./src/api-gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - Keycloak__BaseUrl=${KEYCLOAK_BASE_URL}
      - Keycloak__Realm=${KEYCLOAK_REALM}
    depends_on:
      - academi-keycloak
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Keycloak (Identity & Auth Server) ───────────────────────────────────────
  academi-keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: academi-keycloak
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=mssql
      - KC_DB_URL=${KEYCLOAK_DB_CONNECTION}
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      - academi-mssql
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Academic Service ────────────────────────────────────────────────────────
  academi-academic:
    image: academi/academic-service:latest
    container_name: academi-academic
    build:
      context: ./src/academic-service
      dockerfile: Dockerfile
    ports:
      - "${ACADEMIC_SERVICE_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${ACADEMIC_DB_CONNECTION}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Redis__Connection=${REDIS_CONNECTION}
      - Seq__Url=${SEQ_URL}
    depends_on:
      - academi-mssql
      - academi-rabbitmq
      - academi-redis
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Accounts Service ────────────────────────────────────────────────────────
  academi-accounts:
    image: academi/accounts-service:latest
    container_name: academi-accounts
    build:
      context: ./src/accounts-service
      dockerfile: Dockerfile
    ports:
      - "${ACCOUNTS_SERVICE_PORT:-5002}:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${ACCOUNTS_DB_CONNECTION}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Redis__Connection=${REDIS_CONNECTION}
      - Seq__Url=${SEQ_URL}
    depends_on:
      - academi-mssql
      - academi-rabbitmq
      - academi-redis
    networks:
      - academi-network
    restart: unless-stopped

  # ─── HRM Service ─────────────────────────────────────────────────────────────
  academi-hrm:
    image: academi/hrm-service:latest
    container_name: academi-hrm
    build:
      context: ./src/hrm-service
      dockerfile: Dockerfile
    ports:
      - "${HRM_SERVICE_PORT:-5003}:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${HRM_DB_CONNECTION}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Redis__Connection=${REDIS_CONNECTION}
      - Seq__Url=${SEQ_URL}
    depends_on:
      - academi-mssql
      - academi-rabbitmq
      - academi-redis
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Notification Service ────────────────────────────────────────────────────
  academi-notification:
    image: academi/notification-service:latest
    container_name: academi-notification
    build:
      context: ./src/notification-service
      dockerfile: Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-5004}:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${NOTIFICATION_DB_CONNECTION}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__User=${SMTP_USER}
      - Smtp__Password=${SMTP_PASSWORD}
      - Seq__Url=${SEQ_URL}
    depends_on:
      - academi-rabbitmq
      - academi-mssql
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Report Service ──────────────────────────────────────────────────────────
  academi-report:
    image: academi/report-service:latest
    container_name: academi-report
    build:
      context: ./src/report-service
      dockerfile: Dockerfile
    ports:
      - "${REPORT_SERVICE_PORT:-5005}:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:-Development}
      - AcademicService__Url=${ACADEMIC_SERVICE_URL}
      - AccountsService__Url=${ACCOUNTS_SERVICE_URL}
      - HrmService__Url=${HRM_SERVICE_URL}
      - Seq__Url=${SEQ_URL}
    depends_on:
      - academi-academic
      - academi-accounts
      - academi-hrm
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Microsoft SQL Server 2022 ───────────────────────────────────────────────
  academi-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: academi-mssql
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Redis Cache ─────────────────────────────────────────────────────────────
  academi-redis:
    image: redis:7-alpine
    container_name: academi-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - academi-network
    restart: unless-stopped

  # ─── RabbitMQ Message Bus ────────────────────────────────────────────────────
  academi-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: academi-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Seq (Structured Log Aggregation) ───────────────────────────────────────
  academi-seq:
    image: datalust/seq:latest
    container_name: academi-seq
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=
    volumes:
      - seq-data:/data
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Prometheus (Metrics) ────────────────────────────────────────────────────
  academi-prometheus:
    image: prom/prometheus:latest
    container_name: academi-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - academi-network
    restart: unless-stopped

  # ─── Grafana (Monitoring Dashboards) ─────────────────────────────────────────
  academi-grafana:
    image: grafana/grafana:latest
    container_name: academi-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - academi-prometheus
    networks:
      - academi-network
    restart: unless-stopped

  # ─── React Frontend Application (academi-web) ──────────────────────────────
  academi-web:
    build:
      context: ./apps/academi-web
      dockerfile: Dockerfile
    container_name: academi-web
    ports:
      - "3000:80"
    networks:
      - academi-network
    restart: unless-stopped


